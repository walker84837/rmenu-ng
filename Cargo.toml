[package]
name = "rmenu-ng"
version = "0.2.0"
authors = ["walker84837"]
description = "A rofi and dmenu inspired menu"
repository = "https://github.com/walker84837/rmenu-ng"
readme = "README.md"
edition = "2024"
license = "WTFPL" # TODO: change license

[dependencies]
directories = "6.0.0"
dirs = "6.0.0"
eframe = "0.31.1"
egui = "0.31.1"
fuzzy-matcher = "0.3"
image = "0.25"
ron = "0.10.1"
serde = { version = "1.0.219", features = ["derive"] }
serde-aux = "4.7.0"
serde_ini = "0.2"
serde_json = "1.0.149"
walkdir = "2.5"
